<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060d" />
    <meta name="description" content="Clean Genetics — small-batch, organic, pheno-hunted genetics for the connoisseur." />
    <title>Clean Genetics</title>
    <script>
      // If something ever fails to start, show the reason on screen instead of a blank page.
      (function () {
        function show(msg) {
          var r = document.getElementById('root');
          if (r && r.childElementCount) return;
          var d = document.createElement('pre');
          d.style.cssText = 'color:#6ff3c1;background:#020605;padding:24px;white-space:pre-wrap;font:13px/1.5 monospace;margin:0;min-height:100vh';
          d.textContent = 'Clean Genetics failed to start:\n' + msg;
          document.body.appendChild(d);
        }
        window.addEventListener('error', function (e) { setTimeout(function () { show(String(e.message || e.error)); }, 300); });
        window.addEventListener('unhandledrejection', function (e) { setTimeout(function () { show(String(e.reason)); }, 300); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
